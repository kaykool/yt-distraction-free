name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4

      - name: Package extension zip
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          zip -r yt-distraction-free.zip manifest.json rules.json start.js comments.js hide.css background.js README.md LICENSE

      - name: Upload extension asset to release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name || steps.release.outputs['--tag_name'] }}
        run: |
          if [ -n "$TAG_NAME" ]; then
            gh release upload "$TAG_NAME" yt-distraction-free.zip --clobber
          fi
